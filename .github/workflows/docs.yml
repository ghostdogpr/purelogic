name: Docs

on:
  release:
    types: [published]

  pull_request:
    paths:
      - 'docs/**'
      - '.github/workflows/docs.yml'

  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  # pull requests only build the site, so they get their own group and don't queue behind or cancel a pending deployment
  group: ${{ github.event_name == 'pull_request' && format('docs-pr-{0}', github.ref) || 'pages' }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  docs:
    uses: ghostdogpr/.github/.github/workflows/docs.yml@v1
